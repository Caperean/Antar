[package]
name = "antar"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
# --enable-math-native is an emscripten/fastcomp flag that binaryen removed;
# passing it makes `wasm-pack build --release` fail with "Unknown option".
wasm-opt = ["-O4", "--enable-sign-ext", "--enable-simd"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.102", features = [
    "Window",
    "Navigator",
    "HtmlCanvasElement",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuDeviceDescriptor",
    "GpuQueue",
    "GpuRequestAdapterOptions",
    "GpuCanvasContext",
    "GpuCanvasConfiguration",
    "GpuCanvasAlphaMode",
    "GpuTextureFormat",
    "GpuBindGroup",
    "GpuBindGroupDescriptor",
    "GpuBindGroupEntry",
    "GpuBindGroupLayout",
    "GpuBindGroupLayoutDescriptor",
    "GpuBindGroupLayoutEntry",
    "GpuBuffer",
    "GpuBufferDescriptor",
    "gpu_buffer_usage",
    "GpuBufferBinding",
    "GpuBufferBindingLayout",
    "GpuBufferBindingType",
    "GpuSampler",
    "GpuSamplerDescriptor",
    "GpuSamplerBindingLayout",
    "GpuTexture",
    "GpuTextureDescriptor",
    "gpu_texture_usage",
    "GpuTextureView",
    "GpuTextureBindingLayout",
    "GpuTextureSampleType",
    "GpuStorageTextureBindingLayout",
    "GpuShaderModule",
    "GpuShaderModuleDescriptor",
    "GpuRenderPipeline",
    "GpuRenderPipelineDescriptor",
    "GpuVertexState",
    "GpuFragmentState",
    "GpuColorTargetState",
    "GpuBlendState",
    "GpuBlendComponent",
    "GpuBlendFactor",
    "GpuBlendOperation",
    "GpuPrimitiveState",
    "GpuPipelineLayout",
    "GpuPipelineLayoutDescriptor",
    "gpu_shader_stage",
    "GpuCommandEncoder",
    "GpuCommandBuffer",
    "GpuCommandEncoderDescriptor",
    "GpuRenderPassEncoder",
    "GpuRenderPassDescriptor",
    "GpuRenderPassColorAttachment",
    "GpuColorDict",
    "GpuExtent3dDict",
    "GpuTexelCopyTextureInfo",
    "GpuTexelCopyBufferLayout",
    "GpuVertexBufferLayout",
    "GpuVertexAttribute",
    "GpuIndexFormat",
    "GpuVertexFormat",
    "GpuVertexStepMode",
    "GpuStoreOp",
    "GpuLoadOp",
    "GpuFilterMode",
]}
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
